name: Automate Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Automatically sync external repositories twice daily (every 12 hours)
    - cron: '0 */12 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native cgit & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cgit git python3

      - name: Cache external Git repositories
        uses: actions/cache@v4
        with:
          path: /tmp/cgit-repos
          key: cgit-repos-${{ hashFiles('repos.conf') }}-${{ github.run_id }}
          restore-keys: |
            cgit-repos-${{ hashFiles('repos.conf') }}-
            cgit-repos-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render all cgit pages natively in parallel
        run: python3 render-all-cgit.py

      - name: Upload gh-pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        if: success() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
