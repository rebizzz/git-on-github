name: Automate Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            renderer/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('renderer/Cargo.toml', 'renderer/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust cgit-renderer
        run: cargo build --release
        working-directory: renderer

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cgit-renderer-bin
          path: renderer/target/release/cgit-renderer

  render-base:
    runs-on: ubuntu-latest
    needs: build-renderer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native cgit
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cgit git

      - name: Download cgit-renderer binary
        uses: actions/download-artifact@v4
        with:
          name: cgit-renderer-bin
          path: bin

      - name: Render site base
        run: |
          chmod +x bin/cgit-renderer
          ./bin/cgit-renderer --base

      - name: Upload site-base artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-base
          path: gh-pages/

  render-repo:
    runs-on: ubuntu-latest
    needs: build-renderer
    strategy:
      fail-fast: false
      matrix:
        repo: [cgit, curl, ripgrep]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native cgit and markdown tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cgit git python3-markdown python3-pygments

      - name: Cache Git repository
        uses: actions/cache@v4
        with:
          path: /tmp/cgit-repos
          key: repo-${{ matrix.repo }}-${{ hashFiles('repos.conf') }}-${{ github.run_id }}
          restore-keys: |
            repo-${{ matrix.repo }}-${{ hashFiles('repos.conf') }}-
            repo-${{ matrix.repo }}-

      - name: Download cgit-renderer binary
        uses: actions/download-artifact@v4
        with:
          name: cgit-renderer-bin
          path: bin

      - name: Render ${{ matrix.repo }}
        run: |
          chmod +x bin/cgit-renderer
          ./bin/cgit-renderer --repo ${{ matrix.repo }}

      - name: Upload repo artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.repo }}
          path: gh-pages/${{ matrix.repo }}.git

  deploy:
    runs-on: ubuntu-latest
    needs: [render-base, render-repo]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: combined-pages

      - name: Merge all artifacts into gh-pages
        run: |
          mkdir -p gh-pages
          cp -r combined-pages/site-base/* gh-pages/
          for dir in combined-pages/repo-*; do
            name=$(basename "$dir" | sed 's/repo-//')
            echo "Merging $name into gh-pages/${name}.git"
            mkdir -p "gh-pages/${name}.git"
            cp -r "$dir"/* "gh-pages/${name}.git/"
          done
          echo "Merged structure:"
          ls -la gh-pages/

      - name: Verify site structure
        run: |
          test -f gh-pages/index.html
          test -f gh-pages/404.html
          test -f gh-pages/cgit-css/cgit.css
          test -f gh-pages/curl.git/tree/src/index.html
          test -f gh-pages/curl.git/tree/include/curl/multi.h/index.html
          test -f gh-pages/curl.git/tree/include/curl/multi.h.html
          test -f gh-pages/curl.git/plain/include/curl/multi.h
          test -f gh-pages/curl.git/blame/include/curl/multi.h/index.html
          test -f gh-pages/curl.git/about/index.html
          test -f gh-pages/cgit.git/tree/index.html
          test -f gh-pages/cgit.git/tree/cgit.c/index.html
          test -f gh-pages/ripgrep.git/log/index.html
          echo "All structural sanity checks passed!"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
