name: Automate Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync-repos:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: |
          KEY="cgit-repos-${{ hashFiles('repos.conf') }}-$(date +%Y-%m-%d)"
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Restore cached repos
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cgit-repos
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            cgit-repos-${{ hashFiles('repos.conf') }}-
            cgit-repos-

      - name: Install git and python3
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y -qq git python3

      - name: Clone/update external repos
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory '*'
          mkdir -p /tmp/cgit-repos
          python3 -c '
          import shlex, subprocess, os
          with open("repos.conf") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"): continue
                  parts = shlex.split(line)
                  name, url = parts[0], parts[1]
                  depth = parts[4] if len(parts) > 4 else None
                  repo_dir = f"/tmp/cgit-repos/{name}.git"
                  if not os.path.exists(repo_dir):
                      print(f"Cloning {name} from {url}...")
                      cmd = ["git", "clone", "--bare", "--no-single-branch", "--no-tags", "--filter=blob:none"]
                      if depth: cmd += ["--depth", depth]
                      cmd += [url, repo_dir]
                      subprocess.run(cmd, check=True)
                  else:
                      print(f"Updating {name}...")
                      subprocess.run(["git", "-C", repo_dir, "fetch", "--all", "--no-tags", "--prune"], check=False)
          '

      - name: Save repos cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/cgit-repos
          key: ${{ steps.cache-key.outputs.key }}

  render-and-deploy:
    runs-on: ubuntu-latest
    needs: sync-repos
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native cgit & dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cgit git

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            renderer/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('renderer/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Rust cgit-renderer
        run: cargo build --release
        working-directory: renderer

      - name: Restore cached external repos
        uses: actions/cache/restore@v4
        with:
          path: /tmp/cgit-repos
          key: ${{ needs.sync-repos.outputs.cache-key }}
          restore-keys: |
            cgit-repos-${{ hashFiles('repos.conf') }}-
            cgit-repos-

      - name: Render all cgit pages in parallel (Rust)
        run: ./renderer/target/release/cgit-renderer

      - name: Upload gh-pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
