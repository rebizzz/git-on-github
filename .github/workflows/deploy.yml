name: Automate Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build cgit container
        run: docker build -t cgit-server .

      - name: Run cgit container
        run: |
          docker run -d --name cgit-app -p 8080:80 -v "$GITHUB_WORKSPACE:/repo:ro" cgit-server

      - name: Scrape cgit output
        run: ./scrape.sh

      - name: Upload gh-pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages

      - name: Deploy to GitHub Pages
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
